services:
  - type: web
    name: relieflink-api
    runtime: python
    rootDir: relieflink/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEATHER_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://relifelife.vercel.app,http://localhost:5173
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
