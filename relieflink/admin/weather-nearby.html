<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReliefLink — Weather & Nearby</title>
<style>
:root{
  --g9:#0b3b2c; --g8:#12503c; --g7:#1b6a4f;
  --cream:#fbf3de; --cream2:#f3e6c4; --gold:#d9b567; --gold2:#f0d894;
  --ink:#0b3b2c; --mut:#8a8567; --white:#fffaf0;
  --sh:0 14px 30px rgba(11,59,44,.18), inset 0 1px 0 rgba(255,255,255,.7);
}
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 80% -10%,var(--gold2),transparent 60%),linear-gradient(160deg,#fff6df,#f1e2b8);
  min-height:100vh;padding:18px}
.wrap{max-width:980px;margin:auto;display:grid;gap:18px;grid-template-columns:1fr 1fr;position:relative}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.wrap.nf .phone.R{order:-1}}
.phone{position:relative;border-radius:46px;overflow:hidden;border:2px solid var(--gold);box-shadow:var(--sh);min-height:640px;display:flex;flex-direction:column}
.phone.L{background:var(--cream)}
.phone.R{background:var(--g9)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:14px}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:16px;color:#eaf5ec}
.cr .ic{background:rgba(11,59,44,.08);color:var(--g9)}
.head{background:linear-gradient(160deg,var(--g8),var(--g9));color:#eaf5ec;padding:18px 18px 74px;position:relative;z-index:1;
  -webkit-mask:radial-gradient(circle 44px at 50% 0,transparent 43px,#000 44px);mask:radial-gradient(circle 44px at 50% 0,transparent 43px,#000 44px)}
.avatar{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;z-index:5;
  background:var(--g9);border:2px solid var(--gold);display:grid;place-items:center;font-size:20px;color:var(--gold2)}
.body{position:relative;z-index:2;margin-top:-52px;background:linear-gradient(180deg,var(--white),var(--cream));
  border-radius:64px 0 0 0;padding:30px 18px 100px;flex:1;box-shadow:0 -6px 18px rgba(11,59,44,.12)}
.body::before{content:"";position:absolute;right:0;top:-44px;width:44px;height:44px;background:radial-gradient(circle at 0 0,transparent 43px,var(--white) 44px)}
.body h3{font-size:14px;color:var(--g8);margin-bottom:2px}
.cr{background:linear-gradient(180deg,var(--white),var(--cream));border-radius:0 0 72px 0;padding:18px 18px 54px;position:relative;z-index:2;box-shadow:0 10px 22px rgba(11,59,44,.18)}
.dk{background:linear-gradient(180deg,var(--g9),#082b20);color:#eaf5ec;margin-top:-36px;padding:66px 18px 100px;flex:1;position:relative;z-index:1}
.dk h3{font-size:14px;color:var(--gold2)}
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:14px 34px 0;
  background:var(--g9);color:var(--gold2);font-size:20px;border-top:2px solid var(--gold);
  -webkit-mask:radial-gradient(circle 42px at 50% 0,transparent 41px,#000 42px);mask:radial-gradient(circle 42px at 50% 0,transparent 41px,#000 42px)}
.R .nav{background:#06271d}
.fab{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:7;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  font-size:26px;cursor:pointer;border:0;background:var(--cream);color:var(--g9);box-shadow:0 8px 18px rgba(0,0,0,.3),inset 0 1px 0 #fff;outline:3px solid var(--gold)}
.tab{display:flex;gap:6px;background:rgba(11,59,44,.08);padding:4px;border-radius:99px}
.tab button{border:0;background:none;padding:8px 16px;border-radius:99px;font:inherit;font-weight:700;color:var(--g8);cursor:pointer}
.tab button.on{background:var(--g9);color:var(--gold2)}
.search{display:flex;gap:8px;align-items:center;border:1.5px solid var(--gold);border-radius:99px;padding:6px 8px 6px 16px;background:rgba(255,255,255,.06);margin-top:30px}
.search input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;min-width:0}
.search input::placeholder{color:#a9c9b5}
.search button{border:0;border-radius:99px;background:var(--gold);color:var(--g9);font-weight:700;padding:8px 14px;cursor:pointer}
.hero{margin-top:14px;border:1.5px solid rgba(217,181,103,.7);border-radius:28px 28px 28px 8px;padding:16px;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.05)}
.hero .big{width:64px;height:64px;border-radius:22px 22px 22px 8px;background:var(--cream);display:grid;place-items:center;font-size:34px;box-shadow:var(--sh)}
.hero h2{font-size:20px}.hero small{color:#bcd8c5;display:block;margin-top:2px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .6s}
.bl{display:flex;justify-content:space-between;font-size:12px;color:#bcd8c5;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:16px}
.t{text-align:center;cursor:pointer;border:0;background:none;font:inherit;color:inherit}
.t .b{width:64px;height:64px;margin:auto;border-radius:22px 22px 22px 8px;display:grid;place-items:center;font-size:30px;background:linear-gradient(180deg,#fff,var(--cream2));box-shadow:var(--sh);transition:transform .15s}
.t:hover .b{transform:translateY(-3px)}.t.on .b{outline:3px solid var(--gold)}
.t:focus-visible{outline:2px solid var(--g7);outline-offset:4px;border-radius:18px}
.t b{display:block;font-size:13px;margin-top:7px}.t small{color:var(--mut);font-size:11px}
.strip{display:flex;gap:8px;margin-top:14px;justify-content:space-between}
.p{flex:1;border-radius:22px 22px 22px 8px;padding:12px 4px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(217,181,103,.3);font-size:12px}
.p.on{background:linear-gradient(180deg,#2b7d60,var(--g7));border-color:var(--gold)}
.p b{display:block;font-size:17px;margin:2px 0}
.dt{margin-top:6px}
/* nearby list cards */
.nc{background:linear-gradient(180deg,var(--white),var(--cream));color:var(--ink);border:1.5px solid var(--gold);border-radius:24px 24px 24px 8px;padding:13px;margin-top:11px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.nc .n{font-weight:700;font-size:14px;line-height:1.25}.nc .s{font-size:11px;color:var(--mut);margin-top:2px}
.nc .d{font-weight:800;font-size:13px;color:#8a6d0b;white-space:nowrap}
.nc .tg{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.nc .tg span{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--cream2);color:#5b5538}
.nc .tg .g{background:#3CC08E33;color:#1f7a58}.nc .tg .r{background:#EF5B5B2b;color:#b5352c}
.nc .bt{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.nc .bt a,.nc .bt span{flex:1;text-align:center;padding:10px 8px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none}
.nc .call{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--g9)}.nc .dir{background:var(--g9);color:var(--gold2)}.nc .off{background:var(--cream2);color:#9a9578}
.msg{margin-top:12px;font-size:12px;color:#bcd8c5;text-align:center;padding:10px}
.wave{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:-1;pointer-events:none}
.note{max-width:980px;margin:14px auto 0;text-align:center;font-size:12px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="gw" x1="0" x2="1"><stop offset="0" stop-color="#d9b567"/><stop offset="1" stop-color="#f0d894"/></linearGradient></defs>
  <path d="M0 170 C240 80 420 250 720 190 C1000 130 1200 60 1440 140 L1440 320 L0 320Z" fill="url(#gw)" opacity=".55"/>
  <path d="M0 230 C260 150 480 290 760 235 C1040 180 1220 130 1440 200 L1440 320 L0 320Z" fill="#12503c"/>
  <path d="M0 232 C260 152 480 292 760 237 C1040 182 1220 132 1440 202" fill="none" stroke="#d9b567" stroke-width="3"/>
</svg>
<div class="wrap" id="wrap">
  <section class="phone L" aria-label="Weather">
    <div class="avatar" id="clock">☁️</div>
    <div class="head">
      <div class="top"><span class="ic">☁️</span><span class="ic">☰</span></div>
      <form class="search" id="sf"><input id="q" placeholder="Search city…" aria-label="Search city"><button>Go</button></form>
      <div class="hero">
        <div class="big" id="hIcon">🌤</div>
        <div style="flex:1">
          <h2 id="hCity">Lahore</h2><small id="hDesc">Loading…</small>
          <div class="bar"><i id="hBar"></i></div>
          <div class="bl"><span id="hTemp">--°C</span><span id="hHum">Humidity --%</span></div>
        </div>
      </div>
    </div>
    <div class="body"><h3>Right now</h3><div class="grid dt" id="det"></div></div>
    <div class="nav"><span>🏠</span><span>⚙️</span></div>
    <button class="fab" id="refresh" aria-label="Refresh">↻</button>
  </section>
  <section class="phone R" aria-label="Cities and nearby">
    <div class="cr">
      <div class="top"><span class="ic">📍</span>
        <div class="tab" id="tabs"><button class="on" data-v="cities">Cities</button><button data-v="nearby">Nearby</button></div>
        <span class="ic">☰</span></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="dk"><h3 id="dkT">Next 5 days</h3><div id="dkB"></div></div>
    <div class="nav"><span>🏠</span><span>⚙️</span></div>
    <div class="fab" aria-hidden="true">☂️</div>
  </section>
</div>
<p class="note">Weather: OpenWeatherMap / Open-Meteo · Nearby: OpenStreetMap</p>
<script>
const $=id=>document.getElementById(id);
const FOCUS=new URLSearchParams(location.search).get('focus');
const CITIES=[['Islamabad',33.6844,73.0479],['Lahore',31.5497,74.3436],['Karachi',24.8607,67.0011],['Peshawar',34.0151,71.5249],['Quetta',30.1798,66.975],['Faisalabad',31.418,73.079],['Multan',30.1575,71.5249],['Rawalpindi',33.5651,73.0169],['Sukkur',27.7052,68.8574]];
const NEAR=[['Hospitals','<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#c4443a" stroke="#0b3b2c" stroke-width="1.2" stroke-linejoin="round"/></svg>'],['Shelters','🏠'],['Mosques','🕌'],['Schools','🏫'],['Pharmacies','💊'],['Police','👮']];
const WE={Clear:'☀️',Clouds:'☁️',Rain:'🌧',Drizzle:'🌦',Thunderstorm:'⛈',Snow:'❄️',Mist:'🌫',Haze:'🌫',Smoke:'🌫',Dust:'🌫',Fog:'🌫'};
const emoji=c=>WE[c]||'🌤';
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur=CITIES[1],view='cities',NBD=null,sel=0,pos=null,plabel='',stripHTML='',gpsHero=false;

/* ---------- weather ---------- */
const okKey=k=>/^[a-f0-9]{32}$/i.test((k||'').trim());
function getKey(){try{if(okKey(window.OWM_KEY))return window.OWM_KEY;let k=localStorage.getItem('owm_key');if(okKey(k))return k.trim();
  if(parent!==window){k=parent.eval('OWM_KEY');if(okKey(k))return k.trim()}}catch(e){}return ''}
const wmo=c=>c===0?'Clear':c<=3?'Clouds':c<=48?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Rain':c<=86?'Snow':'Thunderstorm';
async function jf(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error('http');return r.json()}
async function wx(lat,lon){const k=getKey();
  if(k){try{const [w,f]=await Promise.all([jf(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${k}`),jf(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${k}`)]);
    const days={};f.list.forEach(x=>{const d=x.dt_txt.slice(0,10);(days[d]=days[d]||[]).push(x)});
    return{main:w.weather[0].main,desc:w.weather[0].description,temp:Math.round(w.main.temp),feels:Math.round(w.main.feels_like),hum:w.main.humidity,wind:Math.round(w.wind.speed*3.6),pres:w.main.pressure,vis:((w.visibility||0)/1000).toFixed(1)+' km',clouds:w.clouds.all,
      days:Object.entries(days).slice(0,5).map(([d,a])=>({d,t:Math.round(Math.max(...a.map(x=>x.main.temp_max))),m:a[Math.floor(a.length/2)].weather[0].main}))}}catch(e){}}
  const j=await jf(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,pressure_msl,wind_speed_10m,weather_code,cloud_cover&daily=weather_code,temperature_2m_max&forecast_days=5&timezone=auto`);
  const c=j.current,m=wmo(c.weather_code);
  return{main:m,desc:m.toLowerCase(),temp:Math.round(c.temperature_2m),feels:Math.round(c.apparent_temperature),hum:c.relative_humidity_2m,wind:Math.round(c.wind_speed_10m),pres:Math.round(c.pressure_msl),vis:'n/a',clouds:c.cloud_cover,
    days:j.daily.time.map((d,i)=>({d,t:Math.round(j.daily.temperature_2m_max[i]),m:wmo(j.daily.weather_code[i])}))}}
function dk(){if(view==='cities'){$('dkT').textContent='Next 5 days';$('dkB').innerHTML=stripHTML}else listNear()}
async function loadHero(c){cur=c;$('hCity').textContent=c[0];
  try{const w=await wx(c[1],c[2]);
    $('hIcon').textContent=emoji(w.main);$('hDesc').textContent=w.desc+' · wind '+w.wind+' km/h';$('hTemp').textContent=w.temp+'°C';$('hHum').textContent='Humidity '+w.hum+'%';$('hBar').style.width=w.hum+'%';
    const D=[['🌡','Feels',w.feels+'°C'],['💨','Wind',w.wind+' km/h'],['💧','Humidity',w.hum+'%'],['🧭','Pressure',w.pres+' hPa'],['👁','Visibility',w.vis],['☁️','Clouds',w.clouds+'%']];
    $('det').innerHTML=D.map(d=>`<div class="t"><div class="b">${d[0]}</div><b>${d[2]}</b><small>${d[1]}</small></div>`).join('');
    stripHTML='<div class="strip">'+w.days.map((x,i)=>`<div class="p ${i?'':'on'}">${new Date(x.d).toLocaleDateString('en',{weekday:'short'})}<b>${x.t}°</b>${emoji(x.m)}</div>`).join('')+'</div>';
  }catch(e){$('hDesc').textContent='Weather unavailable';stripHTML='';$('det').innerHTML=''}
  dk()}
async function cities(){
  $('grid').innerHTML=CITIES.map((c,i)=>`<button class="t" data-i="${i}"><div class="b" id="ci${i}">…</div><b>${c[0]}</b><small id="ct${i}">--</small></button>`).join('');
  try{const j=await jf(`https://api.open-meteo.com/v1/forecast?latitude=${CITIES.map(c=>c[1])}&longitude=${CITIES.map(c=>c[2])}&current=temperature_2m,weather_code`);
    (Array.isArray(j)?j:[j]).forEach((x,i)=>{const m=wmo(x.current.weather_code);$('ci'+i).textContent=emoji(m);$('ct'+i).textContent=Math.round(x.current.temperature_2m)+'°C · '+m})}
  catch(e){CITIES.forEach((c,i)=>{$('ci'+i).textContent='🌤';$('ct'+i).textContent='n/a'})}}

/* ---------- nearby (GPS, distance sorted, call + directions) ---------- */
const MIR=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const hav=(a,b,c,d)=>{const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};
const tel=p=>{const x=String(p||'').split(/[;,\/]/)[0].replace(/[^\d+]/g,'');return x.length>=5?x:''};
const fmt=d=>d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km';
async function overpass(la,lo){const q=`[out:json][timeout:25];nwr["amenity"~"^(hospital|shelter|pharmacy|police|school|place_of_worship)$"](around:8000,${la},${lo});out center tags 400;`;
  for(const m of MIR){try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);const r=await fetch(m,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal});clearTimeout(t);if(r.ok)return (await r.json()).elements||[]}catch(e){}}
  throw new Error('osm')}
function build(els,la,lo){const L=[[],[],[],[],[],[]];
  els.forEach(e=>{const t=e.tags||{},a=t.amenity,k=a==='hospital'?0:a==='shelter'?1:a==='place_of_worship'?(t.religion==='muslim'?2:-1):a==='school'?3:a==='pharmacy'?4:a==='police'?5:-1;if(k<0)return;
    const y=e.lat??(e.center&&e.center.lat),x=e.lon??(e.center&&e.center.lon);if(y==null||x==null)return;
    L[k].push({name:t.name||t['name:en']||('Unnamed '+NEAR[k][0].slice(0,-1).toLowerCase()),lat:y,lon:x,dist:hav(la,lo,y,x),phone:tel(t.phone||t['contact:phone']||t['contact:mobile']),
      sub:[t['addr:street'],t['addr:city']].filter(Boolean).join(', ')||(t.opening_hours?'Hours: '+t.opening_hours:''),h24:t.opening_hours==='24/7',er:t.emergency==='yes'})});
  try{const F=parent.eval('FAMOUS_HOSPITALS');if(Array.isArray(F)){let f=F.map(h=>({name:h.name,lat:h.lat,lon:h.lng,dist:hav(la,lo,h.lat,h.lng),phone:tel(h.phone),sub:h.addr+', '+h.city+' · '+h.spec,ver:true})).sort((a,b)=>a.dist-b.dist);
    let n=f.filter(h=>h.dist<=100);if(n.length<3)n=f.slice(0,3);
    n.forEach(h=>{const o=L[0].find(z=>hav(z.lat,z.lon,h.lat,h.lon)<.3||z.name.toLowerCase()===h.name.toLowerCase());if(o){o.phone=h.phone||o.phone;o.sub=h.sub;o.ver=true}else L[0].push(h)})}}catch(e){}
  L.forEach(a=>a.sort((x,y)=>x.dist-y.dist));return L}
function tiles(){$('grid').innerHTML=NEAR.map((n,i)=>`<button class="t ${i===sel?'on':''}" data-n="${i}"><div class="b">${n[1]}</div><b>${n[0]}</b><small>${NBD?NBD[i].length+' within 8 km':'searching…'}</small></button>`).join('')}
function listNear(){const nm=NEAR[sel][0];$('dkT').textContent='Nearest '+nm.toLowerCase();
  if(!NBD){$('dkB').innerHTML='<div class="msg">'+(NBD===undefined?'Locating you…':'Could not load nearby places. Tap ↻ to retry.')+'</div>';return}
  const a=NBD[sel].slice(0,10);
  $('dkB').innerHTML=(plabel?'<div class="msg" style="margin-top:2px">Near '+esc(plabel)+'</div>':'')+(a.length?a.map(f=>`<div class="nc"><div><div class="n">${esc(f.name)}</div>${f.sub?'<div class="s">'+esc(f.sub)+'</div>':''}<div class="tg">${f.ver?'<span class="g">Verified</span>':''}${f.h24?'<span class="g">24/7</span>':''}${f.er?'<span class="r">Emergency</span>':''}</div></div><div class="d">${fmt(f.dist)}</div><div class="bt">${f.phone?`<a class="call" href="tel:${f.phone}" target="_top">📞 Call</a>`:'<span class="off">No number</span>'}<a class="dir" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lon}&travelmode=driving">➤ Directions</a></div></div>`).join(''):'<div class="msg">None found within 8 km. Try another city above.</div>')}
async function nearby(){NBD=undefined;tiles();listNear();
  if(!pos)pos=await new Promise(res=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{plabel='your location';res([p.coords.latitude,p.coords.longitude])},()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000}):res(null));
  let la,lo;if(pos){la=pos[0];lo=pos[1]}else{la=cur[1];lo=cur[2];plabel=cur[0]+' (location not allowed)'}
  try{NBD=build(await overpass(la,lo),la,lo)}catch(e){NBD=null}
  tiles();listNear();
  if(pos&&!gpsHero&&plabel==='your location'){gpsHero=true;loadHero(['Your location',la,lo])}}
function show(){view==='cities'?(cities(),dk()):nearby()}

$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));view=b.dataset.v;show()};
$('grid').onclick=e=>{const t=e.target.closest('.t');if(!t)return;
  if(t.dataset.i!==undefined)loadHero(CITIES[t.dataset.i]);else if(t.dataset.n!==undefined){sel=+t.dataset.n;tiles();listNear()}};
$('refresh').onclick=()=>{loadHero(cur);if(view==='nearby')NBD=undefined;show()};
$('sf').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;
  try{const g=(await jf('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pk&q='+encodeURIComponent(q)))[0];if(!g)throw 0;
    const nm=g.display_name.split(',')[0];loadHero([nm,+g.lat,+g.lon]);if(view==='nearby'){pos=[+g.lat,+g.lon];plabel=nm;nearby()}}
  catch(err){$('hDesc').textContent='City not found'}};
setInterval(()=>{$('clock').title=new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Karachi'})},1000);
/* tell the parent app how tall we are */
try{if(parent!==window)new ResizeObserver(()=>parent.postMessage({rlH:document.documentElement.scrollHeight+4},'*')).observe(document.body)}catch(e){}
if(FOCUS==='nearby'){$('wrap').classList.add('nf');view='nearby';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='nearby'))}
loadHero(cur);show();
</script>
</body>
