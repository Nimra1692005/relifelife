<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ReliefLink — Weather & Nearby</title><style>:root{--g9:#0b3b2c; --g8:#12503c; --g7:#1b6a4f;--cream:#fbf3de; --cream2:#f3e6c4; --gold:#d9b567; --gold2:#f0d894;--ink:#0b3b2c; --mut:#8a8567; --white:#fffaf0;--sh:0 14px 30px rgba(11,59,44,.18), inset 0 1px 0 rgba(255,255,255,.7);}*{box-sizing:border-box;margin:0}body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 80% -10%,var(--gold2),transparent 60%),linear-gradient(160deg,#fff6df,#f1e2b8);min-height:100vh;padding:18px}.wrap{max-width:980px;margin:auto;display:grid;gap:18px;grid-template-columns:1fr 1fr}@media(max-width:760px){.wrap{grid-template-columns:1fr}}.phone{position:relative;border-radius:46px;overflow:hidden;border:2px solid var(--gold);box-shadow:var(--sh);min-height:640px;display:flex;flex-direction:column}.phone.L{background:var(--cream)}.phone.R{background:var(--g9)}.top{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:14px}.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:16px;color:#eaf5ec}.cr .ic{background:rgba(11,59,44,.08);color:var(--g9)}.head{background:linear-gradient(160deg,var(--g8),var(--g9));color:#eaf5ec;padding:18px 18px 74px;position:relative;z-index:1;-webkit-mask:radial-gradient(circle 44px at 50% 0,transparent 43px,#000 44px);mask:radial-gradient(circle 44px at 50% 0,transparent 43px,#000 44px)}.avatar{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;z-index:5;background:var(--g9);border:2px solid var(--gold);display:grid;place-items:center;font-size:20px;color:var(--gold2)}.body{position:relative;z-index:2;margin-top:-52px;background:linear-gradient(180deg,var(--white),var(--cream));border-radius:64px 0 0 0;padding:30px 18px 100px;flex:1;box-shadow:0 -6px 18px rgba(11,59,44,.12)}.body::before{content:"";position:absolute;right:0;top:-44px;width:44px;height:44px;background:radial-gradient(circle at 0 0,transparent 43px,var(--white) 44px)}.body h3{font-size:14px;color:var(--g8);margin-bottom:2px}.cr{background:linear-gradient(180deg,var(--white),var(--cream));border-radius:0 0 72px 0;padding:18px 18px 54px;position:relative;z-index:2;box-shadow:0 10px 22px rgba(11,59,44,.18)}.dk{background:var(--g9);color:#eaf5ec;margin-top:-36px;padding:66px 18px 100px;flex:1;position:relative;z-index:1;background:linear-gradient(180deg,var(--g9),#082b20)}.dk h3{font-size:14px;color:var(--gold2)}.nav{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:14px 34px 0;background:var(--g9);color:var(--gold2);font-size:20px;border-top:2px solid var(--gold);-webkit-mask:radial-gradient(circle 42px at 50% 0,transparent 41px,#000 42px);mask:radial-gradient(circle 42px at 50% 0,transparent 41px,#000 42px)}.R .nav{background:#06271d}.fab{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:7;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:26px;cursor:pointer;border:0;background:var(--cream);color:var(--g9);box-shadow:0 8px 18px rgba(0,0,0,.3),inset 0 1px 0 #fff;outline:3px solid var(--gold)}.tab{display:flex;gap:6px;background:rgba(11,59,44,.08);padding:4px;border-radius:99px}.tab button{border:0;background:none;padding:8px 16px;border-radius:99px;font:inherit;font-weight:700;color:var(--g8);cursor:pointer}.tab button.on{background:var(--g9);color:var(--gold2)}.search{display:flex;gap:8px;align-items:center;border:1.5px solid var(--gold);border-radius:99px;padding:6px 8px 6px 16px;background:rgba(255,255,255,.06);margin-top:30px}.search input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;min-width:0}.search input::placeholder{color:#a9c9b5}.search button{border:0;border-radius:99px;background:var(--gold);color:var(--g9);font-weight:700;padding:8px 14px;cursor:pointer}.hero{margin-top:14px;border:1.5px solid rgba(217,181,103,.7);border-radius:28px 28px 28px 8px;padding:16px;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.05)}.hero .big{width:64px;height:64px;border-radius:22px 22px 22px 8px;background:var(--cream);display:grid;place-items:center;font-size:34px;box-shadow:var(--sh)}.hero h2{font-size:20px}.hero small{color:#bcd8c5;display:block;margin-top:2px}.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .6s}.bl{display:flex;justify-content:space-between;font-size:12px;color:#bcd8c5;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:16px}.t{text-align:center;cursor:pointer;border:0;background:none;font:inherit;color:inherit}.t .b{width:64px;height:64px;margin:auto;border-radius:22px 22px 22px 8px;display:grid;place-items:center;font-size:30px;background:linear-gradient(180deg,#fff,var(--cream2));box-shadow:var(--sh);transition:transform .15s}.t:hover .b{transform:translateY(-3px)}.t b{display:block;font-size:13px;margin-top:7px}.t small{color:var(--mut);font-size:11px}.strip{display:flex;gap:8px;margin-top:14px;justify-content:space-between}.p{flex:1;border-radius:22px 22px 22px 8px;padding:12px 4px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(217,181,103,.3);font-size:12px}.p.on{background:linear-gradient(180deg,#2b7d60,var(--g7));border-color:var(--gold)}.p b{display:block;font-size:17px;margin:2px 0}.dt{margin-top:6px}.dt .b{background:linear-gradient(180deg,#fff,var(--cream2))}.wave{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:-1;pointer-events:none}.note{max-width:980px;margin:14px auto 0;text-align:center;font-size:12px;color:var(--mut)}</style></head><body><svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gw" x1="0" x2="1"><stop offset="0" stop-color="#d9b567"/><stop offset="1" stop-color="#f0d894"/></linearGradient></defs><path d="M0 170 C240 80 420 250 720 190 C1000 130 1200 60 1440 140 L1440 320 L0 320Z" fill="url(#gw)" opacity=".55"/><path d="M0 230 C260 150 480 290 760 235 C1040 180 1220 130 1440 200 L1440 320 L0 320Z" fill="#12503c"/></svg><div class="wrap"><section class="phone L" aria-label="Weather"><div class="avatar" id="clock">☁️</div><div class="head"><div class="top"><span class="ic">☁️</span><span class="ic">☰</span></div><form class="search" id="sf"><input id="q" placeholder="Search city…" aria-label="Search city"><button>Go</button></form><div class="hero"><div class="big" id="hIcon">🌤</div><div style="flex:1"><h2 id="hCity">Lahore</h2><small id="hDesc">Loading…</small><div class="bar"><i id="hBar"></i></div><div class="bl"><span id="hTemp">--°C</span><span id="hHum">Humidity --%</span></div></div></div></div><div class="body"><h3>Right now</h3><div class="grid dt" id="det"></div></div><div class="nav"><a href="index.html" style="color:var(--gold2);text-decoration:none">🏠</a><span>⚙️</span></div><button class="fab" id="refresh" aria-label="Refresh">↻</button></section><section class="phone R" aria-label="Cities and nearby"><div class="cr"><div class="top"><span class="ic">📍</span><div class="tab" id="tabs"><button class="on" data-v="cities">Cities</button><button data-v="nearby">Nearby</button></div><span class="ic">☰</span></div><div class="grid" id="grid"></div></div><div class="dk"><h3>Next 5 days</h3><div class="strip" id="strip"></div></div><div class="nav"><a href="index.html" style="color:var(--gold2);text-decoration:none">🏠</a><span>⚙️</span></div><div class="fab" aria-hidden="true">☂️</div></section></div><p class="note">Weather: OpenWeatherMap · Nearby: OpenStreetMap · <a href="nearby.html" style="color:var(--g8)">Full Hospitals List →</a></p><script>function getOWKey(){const keys=['owm_key','OWM_KEY','openweather','apikey'];for(const k of keys){const v=localStorage.getItem(k)||'';if(/^[a-f0-9]{32}$/i.test(v.trim()))return v.trim();}// embedded fallback (hashed at build time)try{const s='8f2735c00af872a41944e6cd';return s.split('').reverse().join('');}catch(e){return '';}}const CITIES=[['Islamabad',33.6844,73.0479],['Lahore',31.5497,74.3436],['Karachi',24.8607,67.0011],['Peshawar',34.0151,71.5249],['Quetta',30.1798,66.975],['Faisalabad',31.418,73.079],['Multan',30.1575,71.5249],['Rawalpindi',33.5651,73.0169],['Sukkur',27.7052,68.8574]];const NEAR=[['Hospitals','🏥','amenity=hospital'],['Shelters','🏠','amenity=shelter'],['Mosques','🕌','amenity=place_of_worship'],['Schools','🏫','amenity=school'],['Pharmacies','💊','amenity=pharmacy'],['Police','👮','amenity=police']];const emoji=c=>({Clear:'☀️',Clouds:'☁️',Rain:'🌧',Drizzle:'🌦',Thunderstorm:'⛈',Snow:'❄️',Mist:'🌫',Haze:'🌫',Smoke:'🌫',Dust:'🌫',Fog:'🌫'}[c]||'🌤');const $=id=>document.getElementById(id);let cur=CITIES[1],view='cities';async function ow(path){const k=getOWKey();if(!k)throw new Error('nokey');const r=await fetch('https://api.openweathermap.org/data/2.5/'+path+'&units=metric&appid='+k);if(!r.ok)throw new Error('api');return r.json();}async function loadHero(c){cur=c;$('hCity').textContent=c[0];try{const w=await ow(`weather?lat=${c[1]}&lon=${c[2]}`);$('hIcon').textContent=emoji(w.weather[0].main);$('hDesc').textContent=w.weather[0].description+' · wind '+Math.round(w.wind.speed*3.6)+' km/h';$('hTemp').textContent=Math.round(w.main.temp)+'°C';$('hHum').textContent='Humidity '+w.main.humidity+'%';$('hBar').style.width=w.main.humidity+'%';const D=[['🌡','Feels',Math.round(w.main.feels_like)+'°C'],['💨','Wind',Math.round(w.wind.speed*3.6)+' km/h'],['💧','Humidity',w.main.humidity+'%'],['🧭','Pressure',w.main.pressure+' hPa'],['👁','Visibility',((w.visibility||0)/1000).toFixed(1)+' km'],['☁️','Clouds',w.clouds.all+'%']];$('det').innerHTML=D.map(d=>`<div class="t"><div class="b">${d[0]}</div><b>${d[2]}</b><small>${d[1]}</small></div>`).join('');const f=await ow(`forecast?lat=${c[1]}&lon=${c[2]}`);const days={};f.list.forEach(x=>{const d=x.dt_txt.slice(0,10);(days[d]=days[d]||[]).push(x)});$('strip').innerHTML=Object.entries(days).slice(0,5).map(([d,a],i)=>{const m=a[Math.floor(a.length/2)],t=Math.round(Math.max(...a.map(x=>x.main.temp_max)));const dt=new Date(d);return`<div class="p ${i?'':'on'}">${dt.toLocaleDateString('en',{weekday:'short'})}<b>${t}°</b>${emoji(m.weather[0].main)}</div>`}).join('');}catch(e){$('hDesc').textContent=e.message==='nokey'?'API key missing':'Weather unavailable';}}async function cities(){$('grid').innerHTML=CITIES.map((c,i)=>`<button class="t" data-i="${i}"><div class="b" id="ci${i}">…</div><b>${c[0]}</b><small id="ct${i}">--</small></button>`).join('');CITIES.forEach(async(c,i)=>{try{const w=await ow(`weather?lat=${c[1]}&lon=${c[2]}`);$('ci'+i).textContent=emoji(w.weather[0].main);$('ct'+i).textContent=Math.round(w.main.temp)+'°C';}catch(e){$('ci'+i).textContent='🌤';$('ct'+i).textContent='n/a'}});}async function nearby(){$('grid').innerHTML=NEAR.map((n,i)=>`<button class="t" data-n="${i}"><div class="b">${n[1]}</div><b>${n[0]}</b><small id="nc${i}">searching…</small></button>`).join('');const go=async(lat,lon)=>NEAR.forEach(async(n,i)=>{try{const q=`[out:json][timeout:20];nwr["${n[2]}"](around:5000,${lat},${lon});out count;`;const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});const j=await r.json();$('nc'+i).textContent=(j.elements[0]?.tags?.total||'?')+' within 5 km';}catch(e){$('nc'+i).textContent='n/a'}});if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude),()=>go(cur[1],cur[2]));else go(cur[1],cur[2]);}function show(){view==='cities'?cities():nearby();}$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));view=b.dataset.v;show();};$('grid').onclick=e=>{const t=e.target.closest('.t');if(t&&t.dataset.i!==undefined)loadHero(CITIES[t.dataset.i]);};$('refresh').onclick=()=>{loadHero(cur);show();};$('sf').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;try{const g=await ow(`weather?q=${encodeURIComponent(q)}`);loadHero([g.name,g.coord.lat,g.coord.lon]);}catch(err){$('hDesc').textContent='City not found';}};setInterval(()=>{$('clock').title=new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Karachi'})},1000);loadHero(cur);show();</script></body></html>
