<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ReliefLink — Nearby Hospitals</title><style>:root{--g9:#0b3b2c; --g8:#12503c; --g7:#1b6a4f;--cream:#fbf3de; --cream2:#f3e6c4; --gold:#d9b567; --gold2:#f0d894;--white:#fffaf0; --mut:#8a8567; --red:#c4443a;--sh:0 14px 30px rgba(11,59,44,.18), inset 0 1px 0 rgba(255,255,255,.7);}*{box-sizing:border-box;margin:0}body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--g9);padding:18px;min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,var(--gold2),transparent 60%),linear-gradient(160deg,#fff6df,#f1e2b8)}.wave{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:-1;pointer-events:none}.phone{position:relative;max-width:460px;margin:auto;min-height:760px;border-radius:46px;overflow:hidden;border:2px solid var(--gold);box-shadow:var(--sh);background:var(--cream);display:flex;flex-direction:column}.avatar{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;z-index:5;background:var(--g9);border:2px solid var(--gold);display:grid;place-items:center;font-size:20px}.head{position:relative;z-index:1;color:#eaf5ec;padding:18px 18px 70px;background:linear-gradient(160deg,var(--g8),var(--g9));-webkit-mask:radial-gradient(circle 44px at 50% 0,transparent 43px,#000 44px);mask:radial-gradient(circle 44px at 50% 0,transparent 43px,#000 44px)}.top{display:flex;justify-content:space-between;margin-bottom:12px}.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}.search{display:flex;gap:8px;align-items:center;border:1.5px solid var(--gold);border-radius:99px;padding:6px 8px 6px 16px;background:rgba(255,255,255,.06);margin-top:26px}.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit}.search input::placeholder{color:#a9c9b5}.search button,.me{border:0;border-radius:99px;background:var(--gold);color:var(--g9);font-weight:700;padding:8px 14px;cursor:pointer;font:inherit}.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border:1px solid rgba(217,181,103,.5);background:rgba(255,255,255,.07);color:#eaf5ec;border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--gold);color:var(--g9);font-weight:700}.sum{margin-top:14px;border:1.5px solid rgba(217,181,103,.7);border-radius:26px 26px 26px 8px;padding:14px 16px;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.05)}.sum .big{width:56px;height:56px;border-radius:20px 20px 20px 8px;background:var(--cream);display:grid;place-items:center;font-size:30px;box-shadow:var(--sh)}.sum h2{font-size:18px}.sum small{color:#bcd8c5}.body{position:relative;z-index:2;margin-top:-50px;flex:1;background:linear-gradient(180deg,var(--white),var(--cream));border-radius:64px 0 0 0;padding:26px 16px 110px;box-shadow:0 -6px 18px rgba(11,59,44,.12)}.body::before{content:"";position:absolute;right:0;top:-44px;width:44px;height:44px;background:radial-gradient(circle at 0 0,transparent 43px,var(--white) 44px)}.list{display:grid;gap:12px}.h{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:12px;border-radius:26px 26px 26px 8px;background:linear-gradient(180deg,#fff,var(--cream2));box-shadow:var(--sh)}.h .b{width:56px;height:56px;border-radius:20px 20px 20px 8px;display:grid;place-items:center;font-size:28px;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--gold)}.h b{display:block;font-size:15px;line-height:1.25}.h small{color:var(--mut);font-size:12px}.dist{display:inline-block;margin-top:4px;background:var(--g9);color:var(--gold2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}.act{grid-column:1/-1;display:flex;gap:8px}.act a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;padding:9px;border-radius:99px}.call{background:var(--red);color:#fff}.dir{background:var(--g9);color:var(--gold2)}.act a.off{background:rgba(11,59,44,.1);color:var(--mut);pointer-events:none}.msg{text-align:center;color:var(--mut);padding:24px 10px;font-size:14px}.nav{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:14px 34px 0;background:var(--g9);color:var(--gold2);font-size:20px;border-top:2px solid var(--gold);-webkit-mask:radial-gradient(circle 42px at 50% 0,transparent 41px,#000 42px);mask:radial-gradient(circle 42px at 50% 0,transparent 41px,#000 42px)}.fab{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:7;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:24px;cursor:pointer;border:0;background:var(--cream);color:var(--g9);box-shadow:0 8px 18px rgba(0,0,0,.3);outline:3px solid var(--gold)}</style></head><body><svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gw" x1="0" x2="1"><stop offset="0" stop-color="#d9b567"/><stop offset="1" stop-color="#f0d894"/></linearGradient></defs><path d="M0 170 C240 80 420 250 720 190 C1000 130 1200 60 1440 140 L1440 320 L0 320Z" fill="url(#gw)" opacity=".55"/><path d="M0 230 C260 150 480 290 760 235 C1040 180 1220 130 1440 200 L1440 320 L0 320Z" fill="#12503c"/></svg><main class="phone"><div class="avatar">🏥</div><header class="head"><div class="top"><span class="ic">📍</span><span class="ic">☰</span></div><form class="search" id="sf"><input id="q" placeholder="Search area or city…" aria-label="Search area or city"><button>Search</button></form><div class="chips" id="chips"></div><div class="sum"><div class="big">🏥</div><div style="flex:1"><h2 id="sTitle">Nearby hospitals</h2><small id="sSub">Detecting your location…</small></div><button class="me" id="me">📍 My location</button></div></header><section class="body"><div class="list" id="list"><div class="msg">Loading…</div></div></section><div class="nav"><a href="index.html" style="color:var(--gold2);text-decoration:none">🏠</a><span>⚙️</span></div><button class="fab" id="fab" aria-label="Call Rescue 1122">📞</button></main><script>const $=id=>document.getElementById(id);const CITIES=[['Islamabad',33.6844,73.0479],['Lahore',31.5497,74.3436],['Karachi',24.8607,67.0011],['Peshawar',34.0151,71.5249],['Quetta',30.1798,66.975],['Faisalabad',31.418,73.079],['Multan',30.1575,71.5249],['Rawalpindi',33.5651,73.0169]];const km=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));$('chips').innerHTML=CITIES.map((c,i)=>`<button class="chip" data-i="${i}">${c[0]}</button>`).join('');$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));const c=CITIES[b.dataset.i];load(c[1],c[2],c[0])};const OVERPASS_MIRRORS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];async function overpassQuery(query){for(const ep of OVERPASS_MIRRORS){try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(query),signal:AbortSignal.timeout(12000)});if(r.ok)return await r.json();}catch(e){continue;}}throw new Error('Overpass unavailable');}async function load(lat,lon,label){$('sTitle').textContent='Hospitals near '+label;$('sSub').textContent='Searching within 10 km…';$('list').innerHTML='<div class="msg">Loading hospitals…</div>';try{const q=`[out:json][timeout:25];nwr["amenity"~"hospital|clinic"](around:10000,${lat},${lon});out center tags 40;`;const j=await overpassQuery(q);const hs=j.elements.map(e=>{const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;return{n:e.tags.name||e.tags['name:en']||'Unnamed hospital',la,lo,d:km(lat,lon,la,lo),ph:(e.tags.phone||e.tags['contact:phone']||'').split(';')[0].trim(),ad:[e.tags['addr:street'],e.tags['addr:city']].filter(Boolean).join(', ')}}).filter(h=>h.la).sort((a,b)=>a.d-b.d);$('sSub').textContent=hs.length+' found · closest first';$('list').innerHTML=hs.length?hs.map(h=>`<article class="h"><div class="b">🏥</div><div><b>${esc(h.n)}</b><small>${esc(h.ad||'Address not listed')}</small><br><span class="dist">${h.d.toFixed(1)} km</span></div><div class="act"><a class="call ${h.ph?'':'off'}" href="${h.ph?'tel:'+esc(h.ph.replace(/[^+\d]/g,'')):'#'}">${h.ph?'Call':'No number'}</a><a class="dir" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${h.la},${h.lo}">Directions</a></div></article>`).join(''):'<div class="msg">No hospitals found nearby. Try another area.</div>';}catch(e){$('sSub').textContent='Could not load';$('list').innerHTML='<div class="msg">Hospital data is unavailable. Check connection.</div>';}}function locate(){if(!navigator.geolocation){document.querySelectorAll('.chip')[0].click();return;}navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude,'your location'),()=>document.querySelectorAll('.chip')[0].click(),{timeout:8000});}$('me').onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));locate();};$('fab').onclick=()=>location.href='tel:1122';$('sf').onsubmit=async e=>{e.preventDefault();const t=$('q').value.trim();if(!t)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pk&q='+encodeURIComponent(t));const j=await r.json();if(!j.length)throw 0;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));load(+j[0].lat,+j[0].lon,t);}catch(err){$('sSub').textContent='Area not found';}};locate();</script></body></html>
