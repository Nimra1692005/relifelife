<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReliefLink – Neighbourhood Mesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .mbar { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--g); color: #fff; position: sticky; top: 0; z-index: 20; }
  .mbar a { color: #fff; opacity: .85; font-size: 13px; font-weight: 600; }
  .mbar a:hover { opacity: 1; }
  .mbar h1 { font-size: 16px; font-weight: 800; flex: 1; }
  .mbar .live { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; opacity: .9; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3CC08E; box-shadow: 0 0 0 0 rgba(60,192,142,.6); animation: pulse 1.6s infinite; }
  .dot.off { background: var(--o); animation: none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(60,192,142,.5)} 70%{box-shadow:0 0 0 7px rgba(60,192,142,0)} 100%{box-shadow:0 0 0 0 rgba(60,192,142,0)} }

  .wrap { flex: 1; width: 100%; max-width: 620px; margin: 0 auto; padding: 16px 16px 130px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--rad); padding: 16px; box-shadow: var(--sh); }
  .zone-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .zone-row label { font-size: 12px; font-weight: 700; color: var(--mute); }
  .zone-row input { flex: 1; min-width: 150px; }
  .field { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  .field:focus { outline: none; border-color: var(--gold); }

  .radar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .radar b { font-size: 22px; font-weight: 800; color: var(--g); }
  .radar small { display: block; font-size: 12px; color: var(--mute); }
  .btn-o { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: 13px; color: var(--g); transition: .2s; }
  .btn-o:hover { border-color: var(--gold); background: rgba(201,162,39,.07); }

  .feed { display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .av { width: 34px; height: 34px; border-radius: 10px; background: var(--g2); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; flex: none; }
  .msg.me .av { background: var(--gold); color: #3a2f00; }
  .bubble { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px; max-width: 82%; }
  .msg.me .bubble { border-color: var(--gold2); background: rgba(232,200,106,.14); }
  .msg.sos .bubble { border-color: #EF5B5B; background: rgba(239,91,91,.10); }
  .who { font-size: 11.5px; font-weight: 700; color: var(--mute); margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
  .sos-tag { color: #B91C1C; font-weight: 800; }
  .txt { font-size: 14px; line-height: 1.45; word-break: break-word; }
  .empty { text-align: center; color: var(--mute); font-size: 13px; padding: 30px 10px; }

  .composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1.5px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .composer-in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .c-row { display: flex; gap: 10px; align-items: flex-end; }
  .c-row textarea { flex: 1; resize: none; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; font: inherit; font-size: 14px; min-height: 44px; max-height: 120px; background: #fff; }
  .c-row textarea:focus { outline: none; border-color: var(--gold); }
  .send { border: none; background: var(--g); color: #fff; border-radius: 12px; padding: 0 18px; height: 44px; font-weight: 800; font-size: 14px; transition: .2s; }
  .send:hover { background: var(--g2); }
  .send:disabled { opacity: .5; cursor: default; }
  .c-opts { display: flex; align-items: center; gap: 16px; font-size: 12.5px; color: var(--mute); }
  .c-opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .sos-switch input { width: 16px; height: 16px; accent-color: #B91C1C; }
  .sos-switch.on { color: #B91C1C; font-weight: 800; }
</style>
</head><body>

<div class="mbar">
  <a href="help.html">← Back</a>
  <h1>Neighbourhood Mesh</h1>
  <span class="live"><span class="dot" id="dot"></span><span id="liveTxt">Live</span></span>
</div>

<div class="wrap">
  <div class="card">
    <div class="zone-row">
      <label>Your area</label>
      <input class="field" id="zone" placeholder="e.g. Rajanpur" autocomplete="off">
      <button class="btn-o" id="locBtn" type="button">📍 Use my location</button>
    </div>
  </div>

  <div class="card radar">
    <div><b id="nearby">0</b><small id="nearbyLbl">people near you in this zone</small></div>
    <div style="text-align:right"><small id="hasLoc">Location off — tap “Use my location”</small></div>
  </div>

  <div class="feed" id="feed"><div class="empty">Loading the mesh…</div></div>
</div>

<form class="composer" id="composer" autocomplete="off">
  <div class="composer-in">
    <div class="c-row">
      <textarea id="body" placeholder="Message people near you…" maxlength="1000"></textarea>
      <button class="send" id="sendBtn" type="submit">Send</button>
    </div>
    <div class="c-opts">
      <label class="sos-switch" id="sosWrap"><input type="checkbox" id="sos"> 🚨 This is urgent (SOS)</label>
      <span id="hint"></span>
    </div>
  </div>
</form>

<script src="../config.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  var API = window.RL_API;
  var $ = function (id) { return document.getElementById(id); };
  var me = (window.RL_GetUser && window.RL_GetUser()) || {};
  var MYNAME = (me.name || 'Neighbour').slice(0, 30);
  var myPos = null;              // {lat,lng}
  var lastSeen = null;           // newest created_at iso
  var msgs = [];                 // rendered messages
  var peers = [];                // located peers in the zone
  var pollTimer = null;
  var normZone = function (v) { return String(v || '').trim().toLowerCase().replace(/[^\w\- ]/g, '').slice(0, 40).trim() || 'general'; };

  $('zone').value = me.area || me.city || '';

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString('en-PS', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  function ini(n) { var p = String(n).trim().split(/\s+/); return ((p[0] || '?')[0] + ((p[1] || '')[0] || '')).toUpperCase(); }
  function haversine(a, b) {
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function renderFeed() {
    var feed = $('feed');
    if (!msgs.length) { feed.innerHTML = '<div class="empty">No messages yet in this area. Say something — or raise an SOS if you need help.</div>'; return; }
    feed.innerHTML = msgs.map(function (m) {
      var mine = m.fromMe ? ' me' : '';
      return '<div class="msg' + (m.emergency ? ' sos' : '') + mine + '">'
        + '<div class="av">' + esc(ini(m.sender)) + '</div>'
        + '<div class="bubble"><div class="who">' + esc(m.sender) + (m.emergency ? ' <span class="sos-tag">🚨 SOS</span>' : '') + ' · ' + fmtTime(m.created_at) + '</div>'
        + '<div class="txt">' + esc(m.body) + '</div></div></div>';
    }).join('');
    feed.scrollTop = feed.scrollHeight;
  }

  function renderRadar() {
    var label = 'people near you in this zone', n;
    if (myPos) {
      n = peers.filter(function (p) { return haversine(myPos, { lat: p.lat, lng: p.lon }) <= 1; }).length;
    } else {
      n = peers.length;
      label = 'people sharing location in this zone';
    }
    $('nearby').textContent = n;
    $('nearbyLbl').textContent = label;
  }

  function ingest(data) {
    if (!data) return;
    (data.messages || []).forEach(function (m) {
      if (lastSeen && m.created_at && m.created_at <= lastSeen) { /* existing */ }
      m.fromMe = m.sender === MYNAME;
      msgs.push(m);
      if (m.created_at && (!lastSeen || m.created_at > lastSeen)) lastSeen = m.created_at;
    });
    if (msgs.length > 120) msgs = msgs.slice(-120);
    if (Array.isArray(data.peers)) peers = data.peers;
    renderFeed(); renderRadar();
  }

  function poll(silent) {
    if (!API) { setOffline(); return; }
    var zone = normZone($('zone').value);
    var url = '/mesh?zone=' + encodeURIComponent(zone) + (lastSeen ? '&since=' + encodeURIComponent(lastSeen) : '');
    window.RL_Get(url).then(function (d) {
      if (d) { ingest(d); setOnline(); }
      else if (!silent) setOffline();
    });
  }

  function setOnline() { $('dot').className = 'dot'; $('liveTxt').textContent = 'Live'; }
  function setOffline() { $('dot').className = 'dot off'; $('liveTxt').textContent = 'Offline'; }

  function startPoll() {
    if (pollTimer) clearInterval(pollTimer);
    if (!API) return;
    pollTimer = setInterval(function () { poll(true); }, 4000);
  }

  // ── location ──
  $('locBtn').addEventListener('click', function () {
    if (!navigator.geolocation) { $('hint').textContent = 'Location not supported'; return; }
    $('locBtn').textContent = 'Locating…';
    navigator.geolocation.getCurrentPosition(function (p) {
      var la = p.coords.latitude, lo = p.coords.longitude;
      if (la < 23.6 || la > 37.3 || lo < 58.4 || lo > 78.4) { $('hint').textContent = 'Outside Pakistan — type your area instead'; $('locBtn').textContent = '📍 Use my location'; return; }
      myPos = { lat: la, lng: lo };
      $('hasLoc').textContent = 'Your location shared · radar on';
      $('locBtn').textContent = '📍 Location on';
      renderRadar();
    }, function () { $('hint').textContent = 'Could not get location'; $('locBtn').textContent = '📍 Use my location'; }, { timeout: 10000, maximumAge: 60000 });
  });

  // ── sending ──
  var bodyEl = $('body');
  bodyEl.addEventListener('input', function () { bodyEl.style.height = 'auto'; bodyEl.style.height = Math.min(bodyEl.scrollHeight, 120) + 'px'; });
  $('sos').addEventListener('change', function (e) { $('sosWrap').className = 'sos-switch' + (e.target.checked ? ' on' : ''); });
  $('zone').addEventListener('change', function () { lastSeen = null; msgs = []; peers = []; renderFeed(); renderRadar(); poll(); startPoll(); });

  $('composer').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var txt = bodyEl.value.trim();
    if (!txt) return;
    var btn = $('sendBtn'); btn.disabled = true;
    var payload = { zone: normZone($('zone').value), sender: MYNAME, body: txt, emergency: $('sos').checked };
    if (myPos) { payload.lat = myPos.lat; payload.lon = myPos.lng; }
    var done = function () { bodyEl.value = ''; bodyEl.style.height = 'auto'; btn.disabled = false; poll(); };
    if (!API) { msgs.push({ sender: MYNAME, body: txt, emergency: payload.emergency, created_at: new Date().toISOString(), fromMe: true }); renderFeed(); btn.disabled = false; return; }
    window.RL_Send('POST', '/mesh', payload).then(done, done);
  });

  // ── boot ──
  if (!API) setOffline();
  poll(); startPoll();
})();
</script>
</body></html>
